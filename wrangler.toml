name = "visionhardware-web"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

# Production site - Cloudflare creates DNS and TLS automatically.
[[routes]]
pattern = "visionhardware.net"
custom_domain = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[vars]
ENVIRONMENT = "production"
INQUIRIES_ENABLED = "false"
ALLOW_EMAIL_SEND = "false"
PRIVACY_APPROVED = "false"
